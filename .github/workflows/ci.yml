name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.9

      - name: Lint (Ruff)
        run: ruff check .

      - name: Tests (pytest, inklusive Oberfläche im Offline-Modus)
        env:
          AGENT_MODUS: offline
        run: pytest -q
